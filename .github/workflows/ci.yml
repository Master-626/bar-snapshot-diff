name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check src tests

  tests:
    name: pytest ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest build
      - name: Test the source tree
        run: python -m pytest
        env:
          PYTHONPATH: src
      - name: Build and install the wheel
        run: |
          python -m build
          python -m pip install --no-deps dist/*.whl
      - name: Test the installed package
        run: |
          python -c "import bar_snapshot_diff as pkg; assert pkg.__version__ == '0.1.1'; assert 'site-packages' in pkg.__file__ or 'dist-packages' in pkg.__file__"
          python -m pytest
      - run: bar-snapshot-diff --help
