[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bar-snapshot-diff"
version = "0.1.0"
description = "Read-only comparison of closed OHLCV CSV snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
[project.scripts]
bar-snapshot-diff = "bar_snapshot_diff.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
